# ============================================================
# Extent Reports — Cucumber7 Adapter Configuration
# ============================================================
# This file configures the ExtentCucumberAdapter plugin used in
# the Cucumber @CucumberOptions plugin list.
#
# Plugin entry in runner:
#   "com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
# ============================================================

# Enable or disable the adapter
extent.reporter.spark.start=true
extent.reporter.spark.out=target/reports/ExtentReport.html

# Optional: HTML report title
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Attach screenshots on failure
screenshot.dir=target/screenshots
screenshot.rel.path=../screenshots/

# System info appended to report
systeminfo.os=${os.name}
systeminfo.java=${java.version}
