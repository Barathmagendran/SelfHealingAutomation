# ==============================================================
# testData.yml — Centralized Test Data
# ==============================================================
# Organizes test data by domain (users, api, products, mobile).
# Each section maps directly to a typed accessor in YamlDataReader.
#
# Usage in step definitions:
#   TestData.users().get("validUser").getEmail()
#   TestData.api().getBaseHeaders()
#   TestData.products().get("laptop").getPrice()
#
# Sensitive values (passwords, tokens) should be referenced as
# ${ENV_VAR} placeholders and resolved at runtime via environment
# variables or a secrets manager in production CI/CD pipelines.
# ==============================================================

# ──────────────────────────────────────────────────────────────
# USERS — Login credentials and user profile data
# ──────────────────────────────────────────────────────────────
