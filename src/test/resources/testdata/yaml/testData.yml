  validUser:
    firstName:  Test
    lastName:   User
    email:      testuser@example.com
    password:   Password@123
    role:       viewer
    phone:      "+1-555-0100"

  adminUser:
    firstName:  Admin
    lastName:   Super
    email:      admin@example.com
    password:   Admin@123
    role:       admin
    phone:      "+1-555-0101"

  managerUser:
    firstName:  Manager
    lastName:   Pro
    email:      manager@example.com
    password:   Manager@123
    role:       manager
    phone:      "+1-555-0102"

  viewerUser:
    firstName:  Viewer
    lastName:   Only
    email:      viewer@example.com
    password:   Viewer@123
    role:       viewer
    phone:      "+1-555-0103"

  lockedUser:
