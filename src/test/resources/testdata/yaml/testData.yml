# ──────────────────────────────────────────────────────────────
# API — REST API test data and request payloads
# ──────────────────────────────────────────────────────────────
api:

  auth:
    validCredentials:
      email:    admin@example.com
      password: Admin@123
    invalidCredentials:
      email:    wrong@example.com
      password: WrongPass

  headers:
    default:
      Content-Type:  application/json
      Accept:        application/json
    withAuth:
      Content-Type:  application/json
      Accept:        application/json
      Authorization: "Bearer {token}"     # {token} replaced at runtime

  userPayloads:

    createValid:
      firstName:  ApiCreated
      lastName:   User
      email:      api.created@qa.example.com
      role:       viewer
      phone:      "+1-555-0300"

    createAdmin:
      firstName:  ApiAdmin
      lastName:   User
      email:      api.admin@qa.example.com
      role:       admin
      phone:      "+1-555-0301"

    updatePayload:
      firstName:  UpdatedFirst
      lastName:   UpdatedLast
      phone:      "+1-555-0399"

    duplicateEmail:
      firstName:  Duplicate
      lastName:   ApiUser
      email:      admin@example.com       # Existing email → 409
      role:       viewer

  expectedResponses:
    userListMinSize:   1
    createStatusCode:  201
    getStatusCode:     200
    deleteStatusCode:  204
    notFoundCode:      404
    conflictCode:      409
    unauthorizedCode:  401
    maxResponseTimeMs: 3000

# ──────────────────────────────────────────────────────────────
# MOBILE — Mobile app test data (Appium)
# ──────────────────────────────────────────────────────────────
mobile:

  loginScreen:
    validUser:
      username: mobileuser
      password: Mobile@123

    invalidUser:
      username: mobileuser
      password: WrongPass

    lockedUser:
      username: lockedmobile
      password: Locked@123

  onboarding:
    newUser:
      name:     Mobile Tester
      email:    mobiletester@example.com
      password: MobileTest@123

  searchKeywords:
    valid:      - "laptop"
                - "phone"
                - "tablet"
    noResults:  "xyznonexistent12345"

# ──────────────────────────────────────────────────────────────
# SEARCH & FILTERS — Search functionality test data
# ──────────────────────────────────────────────────────────────
search:

  validKeywords:
    - "laptop"
    - "smartphone"
    - "tablet"
    - "headphones"

  emptyResultKeyword:   "xyznonexistentproduct99999"

  filters:
    priceRange:
      min:  100
      max:  2000
    category:   Electronics
    inStockOnly: true
    sortBy:      price_asc    # price_asc | price_desc | newest | rating

# ──────────────────────────────────────────────────────────────
# FORM VALIDATION — Edge cases and boundary values
# ──────────────────────────────────────────────────────────────
validation:

  email:
    valid:
      - "user@example.com"
      - "user.name+tag@example.co.uk"
      - "user123@sub.domain.com"
    invalid:
      - "notanemail"
      - "@nodomain.com"
      - "missing@"
      - "spaces in@email.com"

  password:
    strong:     "Str0ng!Pass#2024"
    weak:       "pass"
    noUpper:    "password123!"
    noNumber:   "Password!!"
    noSpecial:  "Password123"
    tooShort:   "Ab1!"

  phoneNumbers:
    valid:
      - "+1-555-0100"
      - "+44 20 7946 0958"
      - "555-0100"
    invalid:
      - "notaphone"
      - "000-000-0000"
