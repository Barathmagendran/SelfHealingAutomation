# ==============================================================
# Enterprise Test Automation Framework — Base Configuration
# ==============================================================
# This file is the default config loaded for ALL environments.
# Override specific keys in: src/test/resources/configs/{env}.properties
# Further override at runtime: mvn test -Dkey=value
# ==============================================================

# ----- ENVIRONMENT -----
env=qa

# ----- PLATFORM -----
# Options: web | android | ios | api
platform=web

# ----- BROWSER -----
# Options: chrome | firefox | edge | safari
browser=chrome
headless=false

# ----- APPLICATION -----
# Override per environment in qa.properties / uat.properties / prod.properties
base.url=https://flipkart.com
api.base.url=https://api.qa.example.com

# ----- TIMEOUTS (seconds) -----
implicit.wait=0
explicit.wait=15
page.load.timeout=30
script.timeout=30

# ----- APPIUM SERVER -----
appium.server.host=127.0.0.1
appium.server.port=4723
appium.new.command.timeout=60

# ----- ANDROID CAPABILITIES -----
android.platform.version=13
android.device.name=Android Emulator
android.automation.name=UIAutomator2
android.app.package=com.example.app
android.app.activity=.MainActivity
android.udid=
android.app.path=
android.auto.grant.permissions=true
android.no.reset=false
android.full.reset=false

# ----- iOS CAPABILITIES -----
ios.platform.version=17.0
ios.device.name=iPhone 15
ios.bundle.id=com.example.app
ios.udid=
ios.app.path=
ios.no.reset=false
ios.auto.accept.alerts=true

# ----- API -----
api.content.type=application/json
api.auth.type=bearer
api.connection.timeout=10000
api.read.timeout=30000

# ----- REPORTING -----
extent.report.path=target/reports/ExtentReport.html
extent.report.title=Enterprise QA Automation Report
extent.report.name=Test Execution Report
screenshots.on.failure=true
screenshot.path=target/screenshots

# ----- LOGGING -----
log.level=INFO

# ----- RETRY -----
retry.count=1

# ----- TEST DATA -----
testdata.path=src/test/resources/testdata

# ==============================================================
# SELF-HEALING ENGINE
# ==============================================================
# Master switch — set to false to disable healing in any environment.
healing.enabled=true

# Claude AI model for diagnosis and code generation.
healing.ai.model=claude-sonnet-4-20250514

# Max tokens in Claude's response.
healing.ai.max.tokens=2000

# Package prefix scoping which step classes may be healed.
healing.scope=stepdefinitions

# Max healing retries before escalating to human.
healing.max.retries=3

# Reject any AI patch that changes more than this many lines.
healing.max.patch.lines=50

# Sandbox validation timeout (ms).
healing.sandbox.timeout.ms=15000

# Append-only JSONL audit log path.
healing.audit.path=target/healing-audit.jsonl

# Slack webhook for healing notifications (leave blank to disable).
# healing.slack.webhook=https://hooks.slack.com/services/xxx
