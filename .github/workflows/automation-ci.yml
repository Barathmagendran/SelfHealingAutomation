name: Enterprise QA Automation CI

# ============================================================
# Triggers
# ============================================================
on:
  push:
    branches: [ main, develop, release/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run full regression nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [qa, uat, prod]
      platform:
        description: 'Test platform'
        required: true
        default: 'web'
        type: choice
        options: [web, api, mobile]
      tags:
        description: 'Cucumber tags to run'
        required: false
        default: '@smoke'
      healing_enabled:
        description: 'Enable self-healing engine'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# ============================================================
# Environment variables
# ============================================================
env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1'

jobs:

  # ──────────────────────────────────────────────────────────
  # Job: API Tests (fast, no browser needed)
  # ──────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'api' || github.event.inputs.platform == '' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Run API tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mvn clean test \
            -Dplatform=api \
            -Denv=${{ github.event.inputs.environment || 'qa' }} \
            -Dtags="${{ github.event.inputs.tags || '@smoke and @api' }}" \
            -Dhealing.enabled=${{ github.event.inputs.healing_enabled || 'true' }} \
            -Dsurefire.suiteXmlFiles=testng.xml \
            --no-transfer-progress

      - name: Upload API test reports + healing audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            target/reports/
            target/logs/
            target/healing-audit.jsonl
          retention-days: 30

      # Auto-commit AI-generated patches back to the branch
      - name: Commit self-healed patches (if any)
        if: always()
        run: |
          git config --global user.name  "Self-Healing Engine"
          git config --global user.email "healing-bot@qa-framework.local"
          git add src/main/java/stepdefinitions/ || true
          git diff --staged --quiet || \
            git commit -m "fix(auto-heal): AI self-healing patches [skip ci]"
          git push || true

  # ──────────────────────────────────────────────────────────
  # Job: Web Tests (Chrome headless)
  # ──────────────────────────────────────────────────────────
  web-tests:
    name: Web Tests (Chrome Headless)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'web' || github.event.inputs.platform == '' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Web tests (headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mvn clean test \
            -Dplatform=web \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=${{ github.event.inputs.environment || 'qa' }} \
            -Dtags="${{ github.event.inputs.tags || '@smoke and @web' }}" \
            -Dhealing.enabled=${{ github.event.inputs.healing_enabled || 'true' }} \
            --no-transfer-progress

      - name: Upload Web test reports + healing audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-reports
          path: |
            target/reports/
            target/screenshots/
            target/logs/
            target/healing-audit.jsonl
          retention-days: 30

      # Auto-commit AI-generated patches back to the branch
      - name: Commit self-healed patches (if any)
        if: always()
        run: |
          git config --global user.name  "Self-Healing Engine"
          git config --global user.email "healing-bot@qa-framework.local"
          git add src/main/java/stepdefinitions/ || true
          git diff --staged --quiet || \
            git commit -m "fix(auto-heal): AI self-healing patches [skip ci]"
          git push || true

  # ──────────────────────────────────────────────────────────
  # Job: Publish Reports
  # ──────────────────────────────────────────────────────────
  publish-reports:
    name: Publish Test Reports
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    if: always()

    steps:
      - name: Download API reports
        uses: actions/download-artifact@v4
        with:
          name: api-test-reports
          path: reports/api
        continue-on-error: true

      - name: Download Web reports
        uses: actions/download-artifact@v4
        with:
          name: web-test-reports
          path: reports/web
        continue-on-error: true

      - name: Summarise healing events
        if: always()
        run: |
          echo "## 🔁 Self-Healing Summary" >> $GITHUB_STEP_SUMMARY
          for f in reports/api/healing-audit.jsonl reports/web/healing-audit.jsonl; do
            if [ -f "$f" ]; then
              HEALED=$(grep -c '"event":"HEALED"' "$f" || true)
              ESCALATED=$(grep -c '"event":"ESCALATED"' "$f" || true)
              ERRORS=$(grep -c '"event":"HEALING_ERROR"' "$f" || true)
              echo "| File | Healed | Escalated | Errors |" >> $GITHUB_STEP_SUMMARY
              echo "|------|--------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
              echo "| $f | $HEALED | $ESCALATED | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Publish combined reports
        uses: actions/upload-artifact@v4
        with:
          name: combined-reports
          path: reports/
          retention-days: 90
